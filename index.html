  <body>
    <h1>Rock, Paper & Scissor</h1>
    <h3>Select the option below:</h3>
    <main>
      <div class="container">
        <button value="rock" class="rock">Rock</button>
        <button value="paper" class="paper">Paper</button>
        <button value="scissor" class="scissor">Scissor</button>
      </div>
    </main>
    <div class="results"></div>
    <script defer>
      let humanCount = 0;
      let computerCount = 0;
      let roundCount = 0;

      const main = document.querySelector("main");
      const container = document.querySelector(".container");

      const results = document.querySelector(".results");

      const resultPara = document.createElement("p");

      const roundInfo = document.createElement("p");
      roundInfo.id = "round-info";
      results.appendChild(roundInfo);

      const playAgain = document.createElement("button");
      playAgain.classList.add("again");
      playAgain.innerText = "Play Again";

      const roundByRound = document.createElement("p");
      roundByRound.id = "round-by-round";
      results.appendChild(roundByRound);

      const button = document.querySelectorAll("button");

      function getComputerChoice() {
        const choices = ["rock", "paper", "scissor"];
        let random = Math.floor(Math.random() * 3);
        return choices[random];
      }

      // EVERYTHING WILL BE INSIDE THE BUTTON.FOREACH //
      let humanChoice;
      button.forEach((element) => {
        element.addEventListener("click", (event) => {
          const clikcedEvent = event.target;
          const data = element.value;
          humanChoice = data;
          let computerChoice = getComputerChoice();

          roundByRound.innerText = `your choice was:  +
            ${humanChoice} +
             and the computer's choice was:  +
            ${computerChoice}`;

          if (
            (humanChoice === "rock" && computerChoice === "scissor") ||
            (humanChoice === "paper" && computerChoice === "rock") ||
            (humanChoice === "scissor" && computerChoice === "paper")
          ) {
            roundByRound.innerText = "You win! 1 point to you.";
            humanCount++;
          } else if (humanChoice === computerChoice) {
            roundByRound.innerText = "Same Choice, points to none of you.";
          } else {
            roundByRound.innerText = "You loose! 1 point to the computer.";
            computerCount++;
          }
          roundCount++;

          roundInfo.innerText = `In round = +
            ${roundCount} +
            Your Score:  +
            ${humanCount} +
            Computer's Score:  +
            ${computerCount}`;

          if (roundCount == 5) {
            if (computerCount > humanCount) {
              console.log("Computer Wins");
              resultPara.innerText = "Computer Wins";
              results.appendChild(resultPara);
              results.appendChild(playAgain);
              main.removeChild(container);
            } else if (humanCount > computerCount) {
              console.log("Human is the winner");
              resultPara.innerText = "The Human Wins";
              results.appendChild(resultPara);
              results.appendChild(playAgain);
              main.removeChild(container);
            } else {
              console.log("This is a draw. Maybe next time");
              resultPara.innerText = "This is a draw. Maybe next time";
              results.appendChild(resultPara);
              results.appendChild(playAgain);
              main.removeChild(container);
            }
          }
          playAgain.addEventListener("click", () => {
            window.location.reload();
          });
        });
      });
    </script>
  </body>
</html>
